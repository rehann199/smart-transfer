<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Smart Transfer system overview</title>
  <desc id="d">Two Android phones run a Flutter client. Pairing may use local network discovery, a QR code, or a short numeric code backed by a cloud document that stores only connection metadata. File bytes move directly between the phones over plain HTTP on the local network. Each device keeps transfer history locally. Firebase Analytics, Crashlytics and messaging, Play Billing and mobile ads sit outside the peer link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#151937"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7da2ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fc79a"/>
    </marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6e9ff}
      .h{font-size:24px;font-weight:700}
      .k{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#8f98d6}
      .b{font-size:14px;font-weight:600}
      .s{font-size:12px;fill:#a9b0e0}
      .phone{fill:#1b2a52;stroke:#5b8def;stroke-width:1.5}
      .cell{fill:#1c2044;stroke:#4a5299;stroke-width:1.2}
      .cloud{fill:#3a2a14;stroke:#e0a43a;stroke-width:1.5}
      .ext{fill:#272b47;stroke:#7f8fe0;stroke-width:1.5;stroke-dasharray:6 4}
      .ln{stroke:#7da2ff;stroke-width:2.2;fill:none;marker-end:url(#ar)}
      .lg{stroke:#3fc79a;stroke-width:3;fill:none;marker-end:url(#ag)}
      .ld{stroke:#e0a43a;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#ar)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg)"/>
  <text x="40" y="46" class="h">Smart Transfer: local bytes, cloud pairing hints</text>
  <text x="40" y="72" class="s">Both phones stay on the same Wi-Fi or hotspot. The cloud step never carries file payloads.</text>

  <rect x="40" y="100" width="340" height="560" rx="14" class="phone"/>
  <text x="60" y="128" class="k">PHONE A - FLUTTER CLIENT</text>
  <rect x="60" y="146" width="300" height="56" rx="9" class="cell"/>
  <text x="74" y="172" class="b">Send, Receive, Clone, History</text>
  <text x="74" y="190" class="s">category pickers, QR, device list</text>
  <rect x="60" y="214" width="300" height="56" rx="9" class="cell"/>
  <text x="74" y="240" class="b">Transfer orchestration</text>
  <text x="74" y="258" class="s">pairing, progress, pause, retry</text>
  <rect x="60" y="282" width="140" height="52" rx="9" class="cell"/>
  <text x="74" y="306" class="b">HTTP client</text>
  <text x="74" y="322" class="s">chunked upload</text>
  <rect x="220" y="282" width="140" height="52" rx="9" class="cell"/>
  <text x="234" y="306" class="b">HTTP listener</text>
  <text x="234" y="322" class="s">when receiving</text>
  <rect x="60" y="346" width="300" height="52" rx="9" class="cell"/>
  <text x="74" y="370" class="b">LAN discovery</text>
  <text x="74" y="386" class="s">mDNS browse and advertise</text>
  <rect x="60" y="410" width="300" height="52" rx="9" class="cell"/>
  <text x="74" y="434" class="b">Local stores</text>
  <text x="74" y="450" class="s">history, pending batch, prefs</text>
  <rect x="60" y="474" width="300" height="52" rx="9" class="cell"/>
  <text x="74" y="498" class="b">Foreground task</text>
  <text x="74" y="514" class="s">transfer progress notification</text>

  <rect x="420" y="100" width="360" height="560" rx="14" class="phone"/>
  <text x="440" y="128" class="k">PHONE B - FLUTTER CLIENT</text>
  <rect x="440" y="146" width="320" height="56" rx="9" class="cell"/>
  <text x="454" y="172" class="b">Mirror UI and services</text>
  <text x="454" y="190" class="s">roles swap for send vs receive</text>
  <rect x="440" y="214" width="320" height="56" rx="9" class="cell"/>
  <text x="454" y="240" class="b">Accept or decline sheet</text>
  <text x="454" y="258" class="s">free-space check before bytes</text>
  <rect x="440" y="282" width="320" height="116" rx="9" class="cell"/>
  <text x="454" y="306" class="b">Downloads folder and installs</text>
  <text x="454" y="324" class="s">media saved to user-visible storage</text>
  <text x="454" y="342" class="s">received app packages grouped</text>
  <text x="454" y="360" class="s">install unknown apps when allowed</text>
  <rect x="440" y="410" width="320" height="52" rx="9" class="cell"/>
  <text x="454" y="434" class="b">Resume from partial files</text>
  <text x="454" y="450" class="s">offset query before each file</text>

  <line x1="360" y1="310" x2="420" y2="310" class="lg"/>
  <text x="390" y="298" text-anchor="middle" class="s">Plain HTTP</text>
  <text x="390" y="332" text-anchor="middle" class="s">on LAN only</text>

  <rect x="820" y="100" width="340" height="200" rx="14" class="cloud"/>
  <text x="840" y="128" class="k">FIREBASE (METADATA)</text>
  <rect x="840" y="146" width="300" height="52" rx="9" class="cell"/>
  <text x="854" y="170" class="b">Pairing documents</text>
  <text x="854" y="186" class="s">six-digit code, LAN address, status</text>
  <rect x="840" y="210" width="300" height="52" rx="9" class="cell"/>
  <text x="854" y="234" class="b">Analytics and Crashlytics</text>
  <text x="854" y="250" class="s">events, crashes, no file content</text>
  <rect x="840" y="274" width="300" height="52" rx="9" class="cell"/>
  <text x="854" y="298" class="b">Cloud Messaging</text>
  <text x="854" y="314" class="s">push delivery when configured</text>

  <line x1="210" y1="372" x2="840" y2="172" class="ld"/>
  <line x1="590" y1="372" x2="840" y2="172" class="ld"/>
  <text x="720" y="248" class="s">QR or code lookup when not on same browse result</text>

  <rect x="820" y="330" width="340" height="330" rx="14" class="ext"/>
  <text x="840" y="358" class="k">GOOGLE PLAY SERVICES</text>
  <rect x="840" y="376" width="300" height="48" rx="9" class="cell"/>
  <text x="854" y="404" class="b">In-app purchases (Pro)</text>
  <rect x="840" y="436" width="300" height="48" rx="9" class="cell"/>
  <text x="854" y="464" class="b">Mobile ads and consent</text>
  <rect x="840" y="496" width="300" height="48" rx="9" class="cell"/>
  <text x="854" y="524" class="b">In-app updates</text>
  <rect x="840" y="556" width="300" height="48" rx="9" class="cell"/>
  <text x="854" y="584" class="b">Install-session API for APKs</text>

  <line x1="210" y1="500" x2="840" y2="400" class="ln"/>
  <line x1="590" y1="500" x2="840" y2="400" class="ln"/>

  <text x="40" y="692" class="s">Transport between peers is unencrypted HTTP on the local network unless the OS adds another layer. Throughput depends on Wi-Fi, hardware and file sizes; this diagram does not state speeds.</text>
</svg>
